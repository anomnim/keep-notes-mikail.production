<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keep Notes — Encrypted</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Keep Notes — Encrypted (client-side)</h1>

    <div class="row">
      <label>Password (shared):</label>
      <input id="password" type="password" placeholder="masukkan password...">
      <button id="loadBtn">Buka</button>
      <button id="saveBtn">Simpan</button>
    </div>

    <div id="status">Status: ready</div>

    <textarea id="note" placeholder="Tulis catatan di sini..." rows="15"></textarea>
  </main>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- User must provide firebase config in this file -->
  <script src="config.js"></script>

  <script src="js/crypto.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
